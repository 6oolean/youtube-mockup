<!DOCTYPE html>
<html>
  <head>
    <title>YouTube Mockup</title>
    <style>
      .thumbnail{
        width: 300px;
        display: block;
      }

      .search-bar{
        display: block;
      }

      .video-title{
        width: 300px;
      }

      .video-preview{
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }
    </style>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search">

        My 5th gap year
      </p>

        cemeteryf0g

    </div>

    <div class="video-preview">

</html>
